[package]
name = "tsubame-types"
description = "Built-in codecs for the Tsubame typed key-value store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/tsubame-types"
keywords = ["database", "codec", "encoding", "serialization", "tsubame"]
categories = ["database", "encoding", "serialization"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
byteorder.workspace = true
bincode = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tsubame-traits.workspace = true

[features]
default = []
serde-bincode = ["dep:bincode", "dep:serde"]
serde-json = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
