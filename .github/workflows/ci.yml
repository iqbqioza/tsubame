name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --examples
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      # Higher workspace crates use APIs that are newer than the versions
      # currently published to crates.io. Tarball verification is deferred
      # until the crates are published in dependency order.
      - run: cargo package --workspace --no-verify
